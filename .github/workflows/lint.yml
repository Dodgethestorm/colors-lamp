name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install lint tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML
        run: htmlhint "public/**/*.html"

      - name: Lint CSS
        run: stylelint "public/**/*.css" --config .stylelintrc.json

      - name: Lint JavaScript
        run: eslint "public/**/*.js"
